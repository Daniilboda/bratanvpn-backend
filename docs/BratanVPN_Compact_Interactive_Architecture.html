<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BratanVPN — компактная архитектура</title>
<style>
:root {
  --bg:#111318; --panel:#181b21; --text:#eef2f6; --muted:#a8b0bc;
  --green:#183f22; --green-border:#2f8f46;
  --yellow:#463708; --yellow-border:#c89d10;
  --blue:#15335f; --blue-border:#3b82f6;
  --gray:#262a31; --gray-border:#5e6672;
  --line:#353b45;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Arial,sans-serif}
header{
  position:sticky;top:0;z-index:20;background:rgba(17,19,24,.97);
  border-bottom:1px solid var(--line);padding:10px 14px;
}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0 8px 0 0}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button,input{
  border:1px solid var(--line);background:var(--panel);color:var(--text);
  border-radius:6px;padding:6px 9px;font-size:12px
}
button{cursor:pointer}
button.active{outline:2px solid currentColor}
.cleanBtn{color:#80e493} .modifiedBtn{color:#ffd45c} .projectBtn{color:#8fc0ff}
input{min-width:230px}
main{padding:10px 14px 24px}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;font-size:11px}
.legend span{padding:4px 7px;border-radius:5px;border:1px solid var(--line);cursor:pointer}
.lg-clean{background:var(--green)} .lg-modified{background:var(--yellow)} .lg-project{background:var(--blue)}
.tree{font-family:Consolas,"Cascadia Code",monospace;font-size:11px;line-height:1.12}
.node{margin:1px 0}
.row{
  display:grid;grid-template-columns:16px 15px minmax(180px,auto) 1fr;
  gap:5px;align-items:start;padding:2px 5px;border-radius:3px;border-left:3px solid transparent;
  min-height:20px;
}
.row.directory{background:var(--gray);border-left-color:var(--gray-border)}
.row.framework-clean{background:var(--green);border-left-color:var(--green-border)}
.row.framework-modified{background:var(--yellow);border-left-color:var(--yellow-border)}
.row.project{background:var(--blue);border-left-color:var(--blue-border)}
.row:hover{filter:brightness(1.08)}
.toggle{padding:0;border:0;background:transparent;font-size:11px;line-height:16px}
.icon{font-size:11px;line-height:16px}
.name{font-weight:700;overflow-wrap:anywhere}
.desc{color:var(--muted);font-family:Segoe UI,Arial,sans-serif;overflow-wrap:anywhere}
.changes{grid-column:3/5;color:#ffe79a;font-family:Segoe UI,Arial,sans-serif;font-size:10px;padding:2px 0 1px}
.children{margin-left:15px;border-left:1px dotted #46505d;padding-left:6px}
.hidden{display:none!important}
.dim{opacity:.22}
@media (max-width:900px){
  .row{grid-template-columns:16px 15px minmax(150px,42%) 1fr}
  .tree{font-size:10px}
}
@media (max-width:650px){
  .row{grid-template-columns:14px 14px 1fr}
  .desc{grid-column:3}
  .changes{grid-column:3}
  input{min-width:100%}
}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>BratanVPN — архитектура</h1>
    <div class="toolbar">
      <button class="active" data-filter="all" onclick="setFilter('all')">Все</button>
      <button class="cleanBtn" data-filter="framework-clean" onclick="setFilter('framework-clean')">Без изменений</button>
      <button class="modifiedBtn" data-filter="framework-modified" onclick="setFilter('framework-modified')">С изменениями</button>
      <button class="projectBtn" data-filter="project" onclick="setFilter('project')">Проектные</button>
      <button onclick="expandAll()">Раскрыть</button>
      <button onclick="collapseAll()">Свернуть</button>
      <input id="search" placeholder="Поиск..." oninput="applyView()">
    </div>
  </div>
</header>

<main>
  <div class="legend">
    <span class="lg-clean" onclick="setFilter('framework-clean')">Зелёный — фреймворк без изменений</span>
    <span class="lg-modified" onclick="setFilter('framework-modified')">Жёлтый — фреймворк с изменениями</span>
    <span class="lg-project" onclick="setFilter('project')">Синий — создано проектом</span>
  </div>
  <div id="tree" class="tree"></div>
</main>

let currentFilter='all';

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));

function hasVisible(node,q){
  const text=(node.name+' '+node.path+' '+(node.description||'')+' '+(node.changes||'')).toLowerCase();
  const self=(currentFilter==='all'||node.type===currentFilter||node.type==='directory')&&(!q||text.includes(q));
  return self||(node.children||[]).some(c=>hasVisible(c,q));
}

function render(node){
  const el=document.createElement('div');
  el.className='node';
  el.dataset.type=node.type;
  el.dataset.search=(node.name+' '+node.path+' '+(node.description||'')+' '+(node.changes||'')).toLowerCase();

  const row=document.createElement('div');
  row.className='row '+node.type;
  const has=node.children&&node.children.length;

  const toggle=document.createElement('button');
  toggle.className='toggle';
  toggle.textContent=has?'▾':'';
  if(has) toggle.onclick=()=>{
    const ch=el.querySelector(':scope>.children');
    const hidden=ch.classList.toggle('hidden');
    toggle.textContent=hidden?'▸':'▾';
  };
  row.appendChild(toggle);

  const icon=document.createElement('span');
  icon.className='icon';
  icon.textContent=has?'📁':'📄';
  row.appendChild(icon);

  const name=document.createElement('div');
  name.className='name';
  name.textContent=node.name;
  row.appendChild(name);

  const desc=document.createElement('div');
  desc.className='desc';
  desc.textContent=node.description||'';
  row.appendChild(desc);

  if(node.changes){
    const c=document.createElement('div');
    c.className='changes';
    c.innerHTML='<b>Изменения:</b> '+esc(node.changes);
    row.appendChild(c);
  }
  el.appendChild(row);

  if(has){
    const children=document.createElement('div');
    children.className='children';
    node.children.forEach(n=>children.appendChild(render(n)));
    el.appendChild(children);
  }
  return el;
}

function setFilter(f){
  currentFilter=f;
  document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===f));
  applyView();
}

function applyView(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  function walk(el,node){
    const visible=hasVisible(node,q);
    el.classList.toggle('hidden',!visible);
    const row=el.querySelector(':scope>.row');
    const selfCat=currentFilter==='all'||node.type===currentFilter||node.type==='directory';
    const selfQ=!q||el.dataset.search.includes(q);
    row.classList.toggle('dim',!(selfCat&&selfQ)&&node.type!=='directory');

    const childEls=el.querySelectorAll(':scope>.children>.node');
    (node.children||[]).forEach((child,i)=>walk(childEls[i],child));

    if((q||currentFilter!=='all')&&visible&&node.children?.length){
      const ch=el.querySelector(':scope>.children');
      const t=el.querySelector(':scope>.row>.toggle');
      ch.classList.remove('hidden');
      if(t)t.textContent='▾';
    }
  }
  walk(document.querySelector('#tree>.node'),data);
}

function expandAll(){
  document.querySelectorAll('.children').forEach(x=>x.classList.remove('hidden'));
  document.querySelectorAll('.toggle').forEach(x=>{if(x.textContent)x.textContent='▾'});
}
function collapseAll(){
  document.querySelectorAll('.children').forEach((x,i)=>{if(i>0)x.classList.add('hidden')});
  document.querySelectorAll('.toggle').forEach(x=>{if(x.textContent)x.textContent='▸'});
}

document.getElementById('tree').appendChild(render(data));
</script>
