services:
  postgres:
    image: postgres:16
    container_name: bratanvpn-postgres

    environment:
      POSTGRES_DB: bratanvpn
      POSTGRES_USER: bratanvpn
      POSTGRES_PASSWORD: bratanvpn_password

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: